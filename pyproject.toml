[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-translator"
version = "0.1.0"
description = "Local Chinese speech transcription, guarded refinement and multilingual translation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["translator*"]

[tool.setuptools.package-data]
translator = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

